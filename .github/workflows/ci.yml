# The same gates CLAUDE.md requires before a commit, run on every push to main.
# E2E (Playwright) stays local: it needs the seeded dev servers and browsers.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx vue-tsc --noEmit
      - name: lint
        run: npx eslint .
      - name: format
        run: npm run format:check
      - name: locale keys
        run: npm run check-locales
      - name: unit tests
        run: npx vitest run
      - name: build
        run: npx vite build
