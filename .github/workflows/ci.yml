# The same gates CLAUDE.md requires before a commit, run on every push to main,
# then the Playwright verification smoke against the seeded dev:verify instance.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx vue-tsc --noEmit
      - name: lint
        run: npx eslint .
      - name: format
        run: npm run format:check
      - name: locale keys
        run: npm run check-locales
      - name: unit tests
        run: npx vitest run
      - name: build
        run: npx vite build

  e2e:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The seed and the specs derive every date from the clock; keep the zone of the
      # machine the suite is maintained on, so the runner sees the same weekdays.
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: verification e2e
        run: npx playwright test --project=verification
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
